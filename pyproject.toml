[project]
name = "docextract"
version = "1.0.0"
description = "Extract validated JSON from invoices with Claude structured outputs, with field-level evaluation."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
docextract = "docextract.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
